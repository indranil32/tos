# Local / single-server on-prem stack: PostgreSQL, Keycloak (identity broker), TOS API.
# Passwords here are for development only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_dev_only
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
      KC_HOSTNAME: http://localhost:8080
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]

  tos:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      OWNER_DATABASE_URL: postgres://tos_owner:owner_dev_only@postgres:5432/tos
      APP_DATABASE_URL: postgres://tos_app:app_dev_only@postgres:5432/tos
      APP_DB_ROLE: tos_app
      PLATFORM_OIDC_ISSUER: http://localhost:8080/realms/platform
      TRUSTED_ISSUER_PREFIXES: http://localhost:8080/realms/
      # Tokens say localhost:8080; inside the network Keycloak is keycloak:8080.
      OIDC_URL_REWRITE: http://localhost:8080=http://keycloak:8080
      PORT: "3000"
    ports: ["3000:3000"]

volumes:
  pgdata:
